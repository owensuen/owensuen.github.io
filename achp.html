
<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>加载中…</title>
  <style>
    body {
      margin: 0;
      padding: 0;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      color: white;
      text-align: center;
    }
    .loader {
      font-size: 1.5rem;
      animation: pulse 1.5s infinite;
    }
    @keyframes pulse {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.7; }
    }
    .error {
      background: rgba(255, 0, 0, 0.2);
      padding: 1rem;
      border-radius: 8px;
      margin-top: 1rem;
      font-size: 1.1rem;
    }
  </style>
  <!-- 引入 JSZip 从 CDN -->
  <script src="https://cdn.jsdelivr.net/npm/jszip@3.10.1/dist/jszip.min.js"></script>
</head>
<body>
  <div class="loader">正在解压资源，请稍候…</div>

  <script>
    // 获取当前页面 URL，推断 schp.zip 的路径
    const zipPath = new URL('./_static/b0_mp1-e577a03_only_html_img.zip', window.location.href).href;

    const imageContainer = document.getElementById('imageContainer');
    const loader = document.querySelector('.loader');

    // 支持的图片扩展名
    const imageExtensions = ['.png', '.jpg', '.jpeg', '.gif', '.webp'];

    // 加载并解压 ZIP
    fetch(zipPath)
      .then(response => {
        if (!response.ok) throw new Error(`ZIP 文件加载失败: ${response.status} ${zipPath}`);
        return response.arrayBuffer();
      })
      .then(async (arrayBuffer) => {
        const zip = new JSZip();
        const contents = await zip.loadAsync(arrayBuffer);

        // 预加载所有图片到内存，建立路径映射
        const imageFiles = [];
        // 遍历 ZIP 中所有文件，筛选图片
        zip.forEach((relativePath, file) => {
          if (imageExtensions.some(ext => relativePath.toLowerCase().endsWith(ext))) {
            imageFiles.push({ path: relativePath, file });
            //console.log('interceptImageSrc map ：', relativePath);
          }
        });
        // 为每个图片生成临时 URL 并存入 imageUrlMap 中
        const imageUrlMap = new Map();
        for (const { path, file } of imageFiles) {
          const blob = await file.async('blob');
          const imageUrl = URL.createObjectURL(blob);
          imageUrlMap.set(path, imageUrl);
          //console.log('映射图片：', path, imageUrl);
        }

        // 查找 achp.html 文件
        const htmlFile = contents.file('docs.html');
        if (!htmlFile) {
          throw new Error('ZIP 中未找到 docs.html 文件');
        }

        // 读取 HTML 内容
        let htmlContent = await htmlFile.async('string');

        // achp.html 通过 document.write() 整体替换页面后，原页面对 auth.js 的依赖失效，
        // 新文档无法再接收到 beforeunload，导致 loadCount 只增不减。
        // 故向解压出来的文档重新注入 auth.js 依赖，恢复鉴权与 loadCount 计数。
        const authInject = '<script src="https://cdn.jsdelivr.net/npm/crypto-js@4.1.1/crypto-js.min.js"><\/script>'
                           + '<script src="_static/auth.js"><\/script>'
                           + '<script>checkLoginStatus();<\/script>';
        if (/<\/body>/i.test(htmlContent)) {
          htmlContent = htmlContent.replace(/<\/body>/i, authInject + '</body>');
        } else {
          htmlContent += authInject;
        }

        // 替换当前页面内容
        document.open();
        document.write(htmlContent);
        document.close();

/*

*/

        // 更新浏览器历史记录，模拟跳转到 achp.html
        if ((window.location.protocol === 'http:' || window.location.protocol === 'https:')
          && window.location.pathname.startsWith('/gms/')) {
          history.replaceState({ page: 'achp' }, '', '/gms/achp.html');
        } else {
          history.replaceState({ page: 'achp' }, '', '/achp.html');
        }
        //history.replaceState({ page: 'achp' }, '', '/achp.html');

        // 🚨 关键：等待 DOM 渲染完成
        //await new Promise(requestAnimationFrame);

        // 遍历 img 并根据 imageUrlMap 拦截 imageUrl 为 内存中的图片
		const imgs = document.querySelectorAll('img[src]');
        imgs.forEach(img => {
          const src = img.src.split('/').slice(-1); // 只取文件名，忽略路径
          const fullPath = img.src.replace(window.location.origin + window.location.pathname, ''); // 获取相对路径

          //console.log('interceptImageSrc：', src, fullPath);
          // 尝试匹配 ZIP 中的完整路径（支持子目录）
          for (const [zipImgPath, url] of imageUrlMap.entries()) {
            if (fullPath.endsWith(zipImgPath)) {
              const imageUrl = url;
              //console.log('interceptImageSrc 加载图片：', zipImgPath, imageUrl);
              img.src = imageUrl; // ✅ 拦截并替换！
              img.setAttribute('data-source', 'zip-memory'); // 可选：标记来源
              break;
            }
          }
        });

        // 可选：添加一个提示，让用户知道已成功加载
        //document.body.style.background = '#f8f9fa';
        //document.body.innerHTML = '<div style="text-align:center; padding:2rem; color:#333;">✅ 页面已成功加载</div>';
      })
      .catch((error) => {
        document.body.innerHTML = `
          <div class="error">
            <h2>加载失败</h2>
            <p>${error.message}</p>
            <p>请确认：<br>
              1. achp.zip 是否位于 _static 目录下<br>
              2. ZIP 内是否包含名为 achp.html 的文件<br>
              3. 浏览器是否允许跨域加载静态资源
            </p>
          </div>
        `;
        console.error('解压失败:', error);
      });
  </script>
</body>
</html>
